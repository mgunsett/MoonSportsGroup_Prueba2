<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>OG Moon Sports Group</title>
<link href="https://fonts.googleapis.com/css2?family=Six+Caps&family=Bebas+Neue&family=Outfit:wght@400;500;600&display=block" rel="stylesheet">
<style>
  /* 1200×630. Lo importante (marca + qué hace) queda en el centro-izquierda:
     WhatsApp y LinkedIn recortan la miniatura a cuadrado o la achican mucho. */
  :root{--black:#080808;--gold:#C9A84C;--gold-l:#E8C96A;--gold-d:#9A7A35;--cream:#f2e6cf}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:var(--black)}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;isolation:isolate;font-family:Outfit,sans-serif;color:#fff;
    background:radial-gradient(60% 80% at 78% 70%,rgba(201,168,76,.22),transparent 65%),var(--black)}
  .pitch{position:absolute;inset:0;z-index:-2;background:url(../src/assets/images/fondo_hero.webp) center 70%/cover;filter:grayscale(.6) brightness(.35);opacity:.55;
    -webkit-mask-image:linear-gradient(90deg,transparent 15%,#000 60%);mask-image:linear-gradient(90deg,transparent 15%,#000 60%)}
  .moon{position:absolute;right:95px;top:50%;margin-top:-250px;width:500px;height:500px;border-radius:50%;z-index:-1;
    background:radial-gradient(circle at 60% 40%,rgba(232,201,106,.35),rgba(201,168,76,.1) 55%,transparent 70%);box-shadow:inset 0 0 0 1.5px rgba(201,168,76,.35)}
  .fade{position:absolute;inset:0;background:linear-gradient(90deg,var(--black) 32%,rgba(8,8,8,.55) 48%,transparent 62%)}
  .emblem{position:absolute;right:145px;top:50%;width:400px;height:400px;margin-top:-200px;display:grid;place-items:center}
  .emblem img{width:100%;height:auto;filter:drop-shadow(0 0 60px rgba(201,168,76,.35))}
  .txt{position:absolute;left:64px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:18px}
  /* Título con el heading del proyecto: Six Caps (theme.fonts.heading) */
  h1{font-family:'Six Caps',sans-serif;font-weight:400;font-size:190px;line-height:.8;letter-spacing:.01em;color:#fff;margin-top:4px}
  h1 em{display:block;font-style:normal;color:var(--gold);font-size:150px;line-height:.85;letter-spacing:.02em}
  .tag{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.32em;color:var(--gold)}
  .url{font-size:22px;font-weight:600;letter-spacing:.06em;color:var(--cream);margin-top:14px}
  .bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--gold-d),var(--gold-l),var(--gold-d))}
</style>
</head>
<body>
<div class="og">
  <div class="pitch"></div>
  <div class="moon"></div>
  <div class="emblem"><img src="../src/assets/images/logo_principal.webp" alt=""></div>
  <div class="fade"></div>
  <div class="txt">
    <span class="tag">Agencia de representación</span>
    <h1>MOON SPORTS<em>GROUP</em></h1>
    <span class="url">moonsports-group.com</span>
  </div>
  <div class="bar"></div>
</div>
</body>
</html>
