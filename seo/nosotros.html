<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fondo Nosotros</title>
<style>
  /* Imagen de la sección "Sobre nosotros" (1920×1080), misma composición que la
     original: lado izquierdo libre para el texto, jugadores a la derecha sobre
     una trama de rombos. Se genera con: node seo/nosotros.mjs */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#0a0a0a}
  .bg{position:relative;width:1920px;height:1080px;overflow:hidden;isolation:isolate;background:#0a0a0a}
  /* trama de rombos, sólo del lado derecho y apagándose hacia el texto */
  .pattern{position:absolute;inset:0;z-index:-2;
    -webkit-mask-image:linear-gradient(90deg,transparent 52%,#000 78%);mask-image:linear-gradient(90deg,transparent 52%,#000 78%)}
  .pattern svg{width:100%;height:100%}
  /* luz dorada suave detrás de los jugadores */
  .glow{position:absolute;z-index:-1;left:1040px;top:170px;width:900px;height:900px;border-radius:50%;
    background:radial-gradient(circle at 50% 55%,rgba(201,168,76,.22),rgba(201,168,76,.06) 45%,transparent 70%)}
  .p{position:absolute;bottom:0;transform:translateX(-50%);filter:drop-shadow(0 30px 40px rgba(0,0,0,.75))}
  .p.back{filter:drop-shadow(0 30px 40px rgba(0,0,0,.75)) brightness(.78)}
  /* fundido inferior para que los recortes no terminen en seco */
  .floor{position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(transparent,#0a0a0a 85%)}
</style>
</head>
<body>
<div class="bg">
  <div class="pattern">
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <pattern id="r" width="132" height="152" patternUnits="userSpaceOnUse">
          <g fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.6">
            <!-- rombo vertical -->
            <path d="M66 8 L80 38 L66 68 L52 38 Z"/>
            <!-- paralelogramos inclinados a los costados -->
            <path d="M6 86 L48 86 L38 106 L-4 106 Z"/>
            <path d="M84 86 L126 86 L136 106 L94 106 Z"/>
            <path d="M0 0 L14 30 L0 60 L-14 30 Z"/>
            <path d="M132 0 L146 30 L132 60 L118 30 Z"/>
            <path d="M24 124 L66 124 L56 144 L14 144 Z" opacity=".7"/>
          </g>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#r)"/>
    </svg>
  </div>
  <div class="glow"></div>

  <!-- atrás: Ramos (izquierda, brazos abiertos) y Piovi (derecha) · adelante: Fara -->
  <img class="p back" src="../src/assets/images/luis_ramos1.webp" style="left:1215px;height:840px" alt="">
  <img class="p back" src="../src/assets/images/ezequiel_piovi.webp" style="left:1712px;height:850px" alt="">
  <img class="p" src="../src/assets/images/cain_fara.webp" style="left:1480px;height:930px" alt="">

  <div class="floor"></div>
</div>
</body>
</html>
